name: Build Fabric 26.2 Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Распаковать мод
        run: |
          mkdir -p mod
          unzip -o archive.zip -d mod
          echo "=== Содержимое архива ==="
          find mod -maxdepth 5 -type f

      - name: Найти Gradle проект
        run: |
          GRADLEW=$(find "$GITHUB_WORKSPACE/mod" -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ОШИБКА: gradlew не найден внутри archive.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Найден gradlew: $GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

      - name: Собрать Fabric 26.2
        run: |
          cd "$PROJECT_DIR"
          ./gradlew build --stacktrace

      - name: Найти готовый JAR
        run: |
          echo "=== Готовые JAR ==="
          find "$PROJECT_DIR/build/libs" -type f -name "*.jar"

      - name: Загрузить готовый JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-26.2-Mod
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
